name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            artifact-name: juce-tools-macos

          - name: Windows amd64
            os: windows-latest
            artifact-name: juce-tools-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Download Go dependencies
        working-directory: cli
        run: go mod download

      - name: Build macOS universal binary
        if: matrix.os == 'macos-latest'
        shell: bash
        working-directory: cli
        run: |
          VERSION="${GITHUB_REF_NAME}"

          GOOS=darwin GOARCH=amd64 go build -o "../juce-tools_${VERSION}_darwin_amd64" .
          GOOS=darwin GOARCH=arm64 go build -o "../juce-tools_${VERSION}_darwin_arm64" .

          lipo -create \
            -output "../juce-tools_${VERSION}_darwin_universal" \
            "../juce-tools_${VERSION}_darwin_amd64" \
            "../juce-tools_${VERSION}_darwin_arm64"

          rm "../juce-tools_${VERSION}_darwin_amd64"
          rm "../juce-tools_${VERSION}_darwin_arm64"

      - name: Build Windows binary
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: cli
        run: |
          VERSION="${GITHUB_REF_NAME}"
          GOOS=windows GOARCH=amd64 go build -o "../juce-tools_${VERSION}_windows_amd64.exe" .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: juce-tools_${{ github.ref_name }}_*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: juce-tools ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ./dist/**/*
